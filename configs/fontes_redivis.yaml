# Fontes de dados no Redivis — workflow pneumonia_pipeline (usuária ads_alinelima)
# Referências qualificadas (nome:id) conferidas em 25/10/2026 no notebook 01_infraestrutura.
# Só referências e contagens; nenhum dado sai do Redivis.

workflow: pneumonia_pipeline

fontes:
  chexpert_plus:
    dataset: "CheXpert Plus v1.0 (Stanford AIMI)"
    tabelas:
      metadados:    {ref: "df_chexpert_plus_240401:bavj", linhas: 223462}
      rotulos:      {ref: "chexpert_labels:pmec",         linhas: 3}       # arquivos de rótulo (CheXbert)
      dicom_treino: {ref: "dicom_train:1934",             linhas: 210740}  # índice de arquivos DICOM
      dicom_valid:  {ref: "dicom_valid:mg73",             linhas: 229}

  rsna:
    dataset: "rsna_pneumonia_2018 v1.0 (ads_alinelima)"
    tabelas:
      dicom:   {ref: "dicom:sjtd",   linhas: 30000}   # índice de arquivos DICOM
      rotulos: {ref: "rotulos:wpmr", linhas: 30000}   # rótulo final adjudicado + paciente NIH

  padchest:
    # O dataset "padchest" (cache de 320 px em 16 bits, sem a conversão oficial) foi apagado em 1/11/2026
    # para liberar a cota de 10 GB. O cache oficial (8 bits, percentis na resolução original) é gerado no
    # /out do notebook auditoria_padchest, na leitura dos pacotes da F8, e o teste externo roda lá.
    dataset: null

  cache_treino:
    dataset: "cache_treino (ads_alinelima), privado, versão next — só treino e validação, nenhum teste"
    tabelas:
      plus_c320:   {linhas: 30247}   # 12.100 treino sorteado + 18.147 validação (os incertos vão junto; o carregador os tira)
      plus_listas: {linhas: 3}
      rsna_c320:   {linhas: 20365}
      rsna_listas: {linhas: 3}
